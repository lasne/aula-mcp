name: aula-mcp (lasne)
version: "1.6.2-lasne.1"
slug: aula_mcp_lasne
description: >-
  MCP server for the Danish school platform Aula (lasne fork). MitID
  login survives add-on restarts, updates, and Home Assistant reboots.
  Exposes aula.discover, ugeplan, lektier, messages and more as MCP tools
  that HA's Assist conversation agent (Anthropic / OpenAI / Ollama / etc.)
  can call — including via Voice. Point HA's official `mcp` (client)
  integration at http://homeassistant.local:7878/sse after install.
url: "https://github.com/lasne/aula-mcp"
arch:
  - amd64
  - aarch64
init: false
boot: auto
startup: services
host_network: false
ports:
  7878/tcp: 7878
ports_description:
  7878/tcp: aula-mcp HTTP (/mcp) + SSE (/sse)
map:
  # Pin the mount. With the modern `homeassistant_config` map type,
  # Supervisor mounts HA's configuration directory at /homeassistant by
  # default, not /config (that default is only for the deprecated `config`
  # map). Host `/config/aula-mcp` must appear at the same path in the
  # container so startup can import a bundle from there.
  #
  # The live MitID session stays on the add-on volume `/data/aula-mcp`
  # (see run.sh). That is the store this fork already installed. Bump
  # `version` when this mapping changes: run.sh is baked into the image,
  # and Supervisor will not rebuild until the version changes.
  - type: homeassistant_config
    read_only: false
    path: /config
# In-addon login UI exposed via HA Ingress. The addon binds two ports:
# - 7878 (above): MCP traffic, exposed to the LAN per `ports:`.
# - 8099 (below): setup/login UI, only reachable through HA's Ingress proxy.
#   `ingress_port` MUST stay in sync with AULA_MCP_INGRESS_PORT in run.sh.
ingress: true
ingress_port: 8099
panel_icon: mdi:school
panel_title: aula-mcp (lasne)
options:
  aula_mcp_key: ""
  log: false
  allow_remote: true
schema:
  aula_mcp_key: "password?"
  log: bool
  allow_remote: bool
