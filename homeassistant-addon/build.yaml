# HA Supervisor build config for the aula-mcp add-on.
#
# No `build_from` here: the Dockerfile pins its own base (node:24-bookworm-slim
# for the pnpm install, with the Bun runtime copied out of oven/bun:1.3-debian),
# and letting Supervisor swap the base per-arch would defeat that.
#
# AULA_MCP_REPO must stay this fork. The image clones that URL at build time
# because the add-on directory is the Docker context and cannot COPY the
# rest of the monorepo. Pointing it at Casperjuel/aula-mcp builds upstream.
#
# To pin the add-on to a specific tag instead of `main`, set AULA_MCP_REF below
# (e.g. `AULA_MCP_REF: "v1.6.1"`).
args:
  AULA_MCP_REPO: "https://github.com/lasne/aula-mcp.git"
  AULA_MCP_REF: main
